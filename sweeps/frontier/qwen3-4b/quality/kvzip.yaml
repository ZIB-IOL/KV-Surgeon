program: main.py
method: grid
metric:
  name: accuracy
  goal: maximize

command:
  - ${env}
  - ${interpreter}
  - ${program}

parameters:
  compaction_algorithm:
    value: global_highest_attention_keys
  method_name:
    value: kvzip
  score_method:
    value: "max"
  beta_method:
    value: "zero"
  c2_method:
    value: "direct"
  eval_original:
    value: false

  target_size:
    values: [0.01, 0.02, 0.05, 0.1, 0.2]
  seed:
    values: [0, 1, 2, 3, 4]

  model_name:
    value: "Qwen/Qwen3-4B"
  dataset_name:
    value: "quality"
  query_config:
    value: "repeat"
  n_articles:
    value: 50
  start_article:
    value: 0
  batch_size:
    value: 20
  compute_perplexity:
    value: 1
  log_dir:
    value: "logs/qa_evaluation/frontier/qwen3-4b/quality/kvzip"
