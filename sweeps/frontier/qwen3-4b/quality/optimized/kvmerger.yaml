program: main.py
method: grid
metric:
  name: accuracy
  goal: maximize

command:
  - ${env}
  - ${interpreter}
  - ${program}

parameters:
  compaction_algorithm:
    value: kvmerger
  method_name:
    value: kvmerger
  eval_original:
    value: false

  target_size:
    values: [0.01, 0.02, 0.05, 0.1, 0.2]
  seed:
    values: [0, 1, 2, 3, 4]

  top_k_ratio:
    value: 0.0
  c2_method:
    value: "merge"
  beta_method:
    value: "zero"
  threshold_search_steps:
    value: 20
  on_policy:
    value: false
  query_config:
    value: "context-prefill"

  precomputed_budget_path:
    value: "head_budget_optimization/head_budgets/Qwen3-4B/optimized_agnostic.json"
  max_ratio_per_head:
    value: 0.75

  model_name:
    value: "Qwen/Qwen3-4B"
  dataset_name:
    value: "quality"
  n_articles:
    value: 50
  start_article:
    value: 0
  batch_size:
    value: 20
  compute_perplexity:
    value: 1
  log_dir:
    value: "logs/qa_evaluation/frontier/qwen3-4b/quality/optimized/kvmerger"
