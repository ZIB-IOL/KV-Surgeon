program: main.py
method: grid
metric:
  name: accuracy
  goal: maximize

command:
  - ${env}
  - ${interpreter}
  - ${program}

parameters:
  compaction_algorithm:
    value: loo_evict
  method_name:
    value: obcache_calib_fast
  eval_original:
    value: false

  target_size:
    values: [0.01, 0.02, 0.05, 0.1, 0.2]
  seed:
    values: [0, 1, 2, 3, 4]

  score:
    value: "obcache_k"
  loo_eps:
    value: 0.001
  refit:
    value: "vm"
  c2_solver:
    value: "lstsq"
  nnls_iters:
    value: 2
  nnls_log_lower_bound:
    value: -3
  nnls_log_upper_bound:
    value: 3
  score_max_queries:
    value: 0
  build_max_queries:
    value: 0
  fallback_threshold:
    value: 1.0

  on_policy:
    value: true
  query_config:
    value: "repeat"

  precomputed_budget_path:
    value: "head_budget_optimization/head_budgets/Qwen3-4B-Instruct-2507/optimized_agnostic.json"
  max_ratio_per_head:
    value: 0.75

  model_name:
    value: "Qwen/Qwen3-4B-Instruct-2507"
  max_model_len:
    value: 131072
  dataset_name:
    value: "longhealth5"
  chunking:
    value: "longhealth"
  n_articles:
    value: 4
  start_article:
    value: 0
  batch_size:
    value: 5
  compute_perplexity:
    value: 1
  log_dir:
    value: "logs/qa_evaluation/frontier/qwen3-4b/longhealth/optimized/obcache_calib_fast"
