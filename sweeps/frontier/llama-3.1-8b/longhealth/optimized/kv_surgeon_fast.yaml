program: main.py
method: grid
metric:
  name: accuracy
  goal: maximize

command:
  - ${env}
  - ${interpreter}
  - ${program}

parameters:
  compaction_algorithm:
    value: kv_surgeon
  method_name:
    value: kv_surgeon
  eval_original:
    value: false

  target_size:
    values: [0.01, 0.02, 0.05, 0.1, 0.2]
  seed:
    values: [0, 1, 2, 3, 4]

  pool_factor:
    value: 4.0
  refresh_interval:
    value: 0
  block_size:
    value: 32
  gamma0:
    value: 1.0
  ridge:
    value: 0.01
  refresh_mu_floor:
    value: 0.05
  pool_score:
    value: "truncated"
  truncation_order:
    value: 2

  refit:
    value: "vm"
  c2_solver:
    value: "cholesky"
  nnls_iters:
    value: 2
  nnls_log_lower_bound:
    value: -3
  nnls_log_upper_bound:
    value: 3
  score_max_queries:
    value: 8192
  build_max_queries:
    value: 4096
  build_queries_per_key:
    value: 16
  fallback_threshold:
    value: 0.3
  score_chunk_size:
    value: 4096

  on_policy:
    value: true
  query_config:
    value: "repeat"

  precomputed_budget_path:
    value: "head_budget_optimization/head_budgets/Llama-3.1-8B-Instruct/optimized_agnostic.json"
  max_ratio_per_head:
    value: 0.75

  model_name:
    value: "meta-llama/Llama-3.1-8B-Instruct"
  dataset_name:
    value: "longhealth5"
  chunking:
    value: "longhealth"
  n_articles:
    value: 4
  start_article:
    value: 0
  batch_size:
    value: 5
  compute_perplexity:
    value: 1
  log_dir:
    value: "logs/qa_evaluation/frontier/llama-3.1-8b/longhealth/optimized/kv_surgeon_fast"
