program: main.py
method: grid
metric:
  name: accuracy
  goal: maximize

command:
  - ${env}
  - ${interpreter}
  - ${program}

parameters:
  compaction_algorithm:
    value: original
  method_name:
    value: original
  eval_original:
    value: false

  target_size:
    value: 0.99
  seed:
    values: [0, 1, 2, 3, 4]
  query_config:
    value: "repeat"

  precomputed_budget_path:
    value: "head_budget_optimization/head_budgets/Llama-3.1-8B-Instruct/optimized_agnostic.json"
  max_ratio_per_head:
    value: 0.75

  model_name:
    value: "meta-llama/Llama-3.1-8B-Instruct"
  dataset_name:
    value: "longhealth5"
  chunking:
    value: "longhealth"
  n_articles:
    value: 4
  start_article:
    value: 0
  batch_size:
    value: 5
  compute_perplexity:
    value: 1
  log_dir:
    value: "logs/qa_evaluation/frontier/llama-3.1-8b/longhealth/original"
