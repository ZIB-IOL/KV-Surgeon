program: main.py
method: grid
metric:
  name: accuracy
  goal: maximize

command:
  - ${env}
  - ${interpreter}
  - ${program}

parameters:
  compaction_algorithm:
    value: qfilters
  method_name:
    value: qfilters
  eval_original:
    value: false

  target_size:
    values: [0.01, 0.02, 0.05, 0.1, 0.2]
  seed:
    values: [0, 1, 2, 3, 4]

  filter_path:
    value: "qfilters/pile/gemma-3-12b-it.pt"
  n_sink:
    value: 0
  n_recent:
    value: 0
  query_config:
    value: "repeat"

  precomputed_budget_path:
    value: "head_budget_optimization/head_budgets/gemma-3-12b-it/optimized_agnostic.json"
  max_ratio_per_head:
    value: 0.75

  model_name:
    value: "google/gemma-3-12b-it"
  dataset_name:
    value: "longhealth5"
  chunking:
    value: "longhealth"
  n_articles:
    value: 4
  start_article:
    value: 0
  batch_size:
    value: 5
  compute_perplexity:
    value: 1
  log_dir:
    value: "logs/qa_evaluation/frontier/gemma-3-12b/longhealth/optimized/qfilters_pile"
