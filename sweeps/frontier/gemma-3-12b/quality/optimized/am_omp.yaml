program: main.py
method: grid
metric:
  name: accuracy
  goal: maximize

command:
  - ${env}
  - ${interpreter}
  - ${program}

parameters:
  compaction_algorithm:
    value: omp
  method_name:
    value: omp
  eval_original:
    value: false

  target_size:
    values: [0.01, 0.02, 0.05]
  seed:
    values: [0, 1, 2, 3, 4]

  nnls_iters:
    value: 0
  nnls_log_upper_bound:
    value: 7
  drop_key_beta_cutoff:
    value: -7
  c2_method:
    value: lsq
  k_choice:
    value: 1
  nnls_interval:
    value: 1

  on_policy:
    value: true
  query_config:
    value: "ss-plus-repeat"

  precomputed_budget_path:
    value: "head_budget_optimization/head_budgets/gemma-3-12b-it/optimized_agnostic.json"
  max_ratio_per_head:
    value: 0.75

  model_name:
    value: "google/gemma-3-12b-it"
  dataset_name:
    value: "quality"
  n_articles:
    value: 50
  start_article:
    value: 0
  batch_size:
    value: 20
  compute_perplexity:
    value: 1
  log_dir:
    value: "logs/qa_evaluation/frontier/gemma-3-12b/quality/optimized/am_omp"
