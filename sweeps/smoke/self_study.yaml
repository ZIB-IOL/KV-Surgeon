      - {"algorithm": "kv_surgeon", "pool_factor": 4.0, "refresh_interval": 0, "block_size": 32, "gamma0": 0.0, "ridge": 0.01, "refresh_mu_floor": 0.05, "pool_score": "loo", "refit": "vm", "c2_solver": "lstsq", "nnls_iters": 2, "nnls_log_lower_bound": -3, "nnls_log_upper_bound": 3, "score_max_queries": 0, "build_max_queries": 0, "fallback_threshold": 1.0, "on_policy": true}
      - {"algorithm": "loo_evict", "score": "loo", "loo_eps": 0.001, "refit": "none", "c2_solver": "lstsq", "nnls_iters": 2, "nnls_log_lower_bound": -3, "nnls_log_upper_bound": 3, "score_max_queries": 0, "build_max_queries": 0, "fallback_threshold": 1.0, "on_policy": true}
