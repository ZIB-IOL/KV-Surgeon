program: main.py
method: grid
metric:
  name: accuracy
  goal: maximize

command:
  - ${env}
  - ${interpreter}
  - ${program}

parameters:
  compaction_algorithm:
    value: "highest_attention_keys"
  method_name:
    value: "smoke"
  target_size:
    value: 0.02
  seed:
    value: 0
  n_articles:
    value: 1
  start_article:
    value: 0
  n_questions_per_article:
    value: 10
  compute_perplexity:
    value: 1
  eval_original:
    value: false
  model_name:
    value: "Qwen/Qwen3-4B"
  dataset_name:
    value: "quality"
  batch_size:
    value: 10
  max_ratio_per_head:
    value: 0.75
  query_config:
    value: "context-prefill"
  log_dir:
    value: "logs/qa_evaluation/smoke/prefill"
  method_kwargs:
    values:
      - {"algorithm": "highest_attention_keys", "score_method": "mean", "beta_method": "zero", "c2_method": "direct", "on_policy": false}
      - {"algorithm": "kvmerger", "top_k_ratio": 0.0, "c2_method": "merge", "beta_method": "zero", "threshold_search_steps": 20, "on_policy": false}
