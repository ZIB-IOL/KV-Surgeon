program: main.py
method: grid
metric:
  name: accuracy
  goal: maximize

command:
  - ${env}
  - ${interpreter}
  - ${program}

parameters:
  compaction_algorithm:
    value: loo_evict
  method_name:
    value: loo_evict
  eval_original:
    value: false

  target_size:
    value: 0.02
  seed:
    values: [0, 1, 2, 3, 4]

  score:
    value: "loo"
  loo_eps:
    value: 0.001
  refit:
    values: ["none", "m", "v"]
  c2_solver:
    value: "lstsq"
  nnls_iters:
    value: 2
  nnls_log_lower_bound:
    value: -3
  nnls_log_upper_bound:
    value: 3
  score_max_queries:
    value: 0
  build_max_queries:
    value: 0
  fallback_threshold:
    value: 1.0

  on_policy:
    value: true
  query_config:
    value: "ss-plus-repeat"

  precomputed_budget_path:
    value: "head_budget_optimization/head_budgets/Qwen3-4B/optimized_agnostic.json"
  max_ratio_per_head:
    value: 0.75

  model_name:
    value: "Qwen/Qwen3-4B"
  dataset_name:
    value: "quality"
  n_articles:
    value: 50
  start_article:
    value: 0
  batch_size:
    value: 20
  compute_perplexity:
    value: 1
  log_dir:
    value: "logs/qa_evaluation/ablation_loo_refit"
