program: main.py
method: grid
metric:
  name: accuracy
  goal: maximize

command:
  - ${env}
  - ${interpreter}
  - ${program}

parameters:
  compaction_algorithm:
    value: greedy_evict
  method_name:
    value: greedy_evict
  eval_original:
    value: false

  objective:
    values: ["surrogate", "exact"]
  seed:
    values: [0, 1, 2, 3, 4]

  pool_factor:
    value: 4.0
  block_size:
    value: 32
  refit:
    value: "vm"
  c2_solver:
    value: "lstsq"
  nnls_iters:
    value: 2
  nnls_log_lower_bound:
    value: -3
  nnls_log_upper_bound:
    value: 3
  score_max_queries:
    value: 0
  build_max_queries:
    value: 0
  fallback_threshold:
    value: 1.0
  on_policy:
    value: true
  query_config:
    value: "ss-plus-repeat"
  precomputed_budget_path:
    value: "head_budget_optimization/head_budgets/Qwen3-4B/optimized_agnostic.json"
  max_ratio_per_head:
    value: 0.75
  target_size:
    value: 0.02
  model_name:
    value: "Qwen/Qwen3-4B"
  dataset_name:
    value: "quality"
  n_articles:
    value: 25
  start_article:
    value: 0
  batch_size:
    value: 20
  compute_perplexity:
    value: 1
  log_dir:
    value: "logs/qa_evaluation/ablation_no_compensation"
